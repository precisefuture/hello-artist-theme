name: Deploy to Production

on:
  push:
    branches: [ production ]
  release:
    types: [ published ]

jobs:
  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies and build
      run: |
        if [ -f "composer.json" ]; then
          composer install --no-dev --optimize-autoloader --classmap-authoritative
        fi
        
        if [ -f "package.json" ]; then
          npm ci
          NODE_ENV=production npm run build || npm run prod || echo "No build script available"
        fi

    - name: Prepare production package
      run: |
        # Create deployment directory
        mkdir -p deploy
        
        # Copy only production files
        rsync -av --exclude='.git' \
                  --exclude='node_modules' \
                  --exclude='vendor' \
                  --exclude='.github' \
                  --exclude='*.md' \
                  --exclude='package*.json' \
                  --exclude='composer.*' \
                  --exclude='.*' \
                  --exclude='ci-cd.md' \
                  --exclude='contexto.md' \
                  --exclude='diseno-grafico.md' \
                  ./ deploy/
        
        # Create release info
        echo "${{ github.sha }}" > deploy/VERSION
        echo "$(date -u)" > deploy/DEPLOYED_AT
        echo "${{ github.ref_name }}" > deploy/RELEASE_TAG

    - name: Create backup
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        port: ${{ secrets.PRODUCTION_PORT || 22 }}
        script: |
          # Set environment variables
          export WP_ENV=production
          
          # Navigate to WordPress root
          cd ${{ secrets.PRODUCTION_WP_PATH }}
          
          # Create backup directory with timestamp
          BACKUP_DIR="backups/hello-artist-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$BACKUP_DIR"
          
          # Backup current theme
          if [ -d "wp-content/themes/hello-artist" ]; then
            cp -r wp-content/themes/hello-artist "$BACKUP_DIR/"
            echo "Theme backup created: $BACKUP_DIR"
          fi
          
          # Backup database
          if command -v wp &> /dev/null; then
            wp db export "$BACKUP_DIR/database-$(date +%Y%m%d-%H%M%S).sql"
            echo "Database backup created"
          fi
          
          # Keep only last 5 backups
          ls -t backups/ | tail -n +6 | xargs -r rm -rf

    - name: Enable maintenance mode
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        port: ${{ secrets.PRODUCTION_PORT || 22 }}
        script: |
          cd ${{ secrets.PRODUCTION_WP_PATH }}
          
          # Create maintenance file
          cat > .maintenance << 'EOF'
<?php
$upgrading = time();
EOF
          
          echo "Maintenance mode enabled"

    - name: Deploy to production
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        port: ${{ secrets.PRODUCTION_PORT || 22 }}
        source: "deploy/*"
        target: "${{ secrets.PRODUCTION_WP_PATH }}/wp-content/themes/hello-artist/"
        strip_components: 1

    - name: Post-deployment tasks
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        port: ${{ secrets.PRODUCTION_PORT || 22 }}
        script: |
          cd ${{ secrets.PRODUCTION_WP_PATH }}
          
          # WP-CLI commands
          if command -v wp &> /dev/null; then
            # Update database if needed
            wp core update-db
            
            # Flush rewrite rules
            wp rewrite flush --hard
            
            # Clear all transients
            wp transient delete --all
            
            # Ensure theme is activated
            wp theme activate hello-artist
            
            echo "WordPress maintenance tasks completed"
          fi
          
          # Clear all caches
          if [ -d "wp-content/cache" ]; then
            rm -rf wp-content/cache/*
          fi
          
          # Redis cache flush
          if command -v redis-cli &> /dev/null; then
            redis-cli flushall
          fi
          
          # WP Rocket cache clear (if available)
          if command -v wp &> /dev/null && wp plugin is-active wp-rocket; then
            wp rocket clean --confirm
          fi
          
          # Set production permissions
          find wp-content/themes/hello-artist -type f -exec chmod 644 {} \;
          find wp-content/themes/hello-artist -type d -exec chmod 755 {} \;
          
          # Remove maintenance mode
          rm -f .maintenance
          echo "Maintenance mode disabled"

    - name: Invalidate CDN
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        port: ${{ secrets.PRODUCTION_PORT || 22 }}
        script: |
          # CloudFlare cache purge (if configured)
          if [ ! -z "${{ secrets.CLOUDFLARE_ZONE_ID }}" ]; then
            curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
          fi
          
          # AWS CloudFront invalidation (if configured)
          if [ ! -z "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
              --paths "/*"
          fi

    - name: Health check
      run: |
        echo "Waiting for deployment to settle..."
        sleep 15
        
        # Test production URL
        if curl -f "${{ secrets.PRODUCTION_URL }}" > /dev/null 2>&1; then
          echo "✅ Production deployment successful - site is accessible"
        else
          echo "❌ Production deployment failed - site not accessible"
          exit 1
        fi
        
        # Test critical pages
        critical_pages=(
          "${{ secrets.PRODUCTION_URL }}/"
          "${{ secrets.PRODUCTION_URL }}/shop/"
          "${{ secrets.PRODUCTION_URL }}/contact/"
        )
        
        for url in "${critical_pages[@]}"; do
          if curl -f "$url" > /dev/null 2>&1; then
            echo "✅ $url is accessible"
          else
            echo "⚠️ $url may have issues"
          fi
        done

    - name: Create GitHub release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          🚀 **Production Deployment**
          
          **Commit:** ${{ github.sha }}
          **Author:** ${{ github.actor }}
          **Deployed:** $(date -u)
          
          **Changes in this release:**
          ${{ github.event.head_commit.message }}
        draft: false
        prerelease: false

    - name: Notify deployment
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: |
          🎯 Production deployment ${{ job.status }}
          Branch: ${{ github.ref }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          URL: ${{ secrets.PRODUCTION_URL }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: env.SLACK_WEBHOOK_URL != ''